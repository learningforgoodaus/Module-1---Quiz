<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Module 1: Knowledge Check</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'brand-light': '#C6B4D9',
                        'brand-medium': '#9C7F9D',
                        'brand-dark': '#513873',
                        'brand-darker': '#413659',
                        'brand-bg': '#F2F2F2',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        input[type="checkbox"]:checked { accent-color: #513873; }
        .option-wrapper { transition: all 0.2s ease; cursor: pointer; }
        /* Prevent text selection on rapid tapping of options */
        .option-wrapper { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-brand-bg min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-2xl rounded-xl p-5 md:p-8 max-w-2xl w-full" id="quiz-container">
        
        <div id="quiz-header">
            <h1 class="text-xl md:text-3xl font-bold text-brand-darker mb-1">Module 1 Knowledge Check</h1>
            <p class="text-xs md:text-sm text-gray-500 mb-6" id="question-counter">Question 1 of 4</p>
        </div>

        <div id="question-area">
            <h2 class="text-lg md:text-xl font-semibold text-brand-darker mb-5 leading-tight" id="question-text"></h2>
            
            <div class="space-y-3" id="options-container">
                </div>
        </div>

        <div class="mt-4 min-h-[1.5rem]">
            <p id="feedback-text" class="text-center font-semibold text-base" aria-live="polite"></p>
        </div>

        <div class="mt-4">
            <button id="check-btn" class="w-full bg-brand-dark text-white py-4 px-5 rounded-lg font-bold hover:bg-brand-darker active:scale-[0.98] transition-all focus:outline-none">
                Check Answer
            </button>
        </div>
    </div>

    <div id="correct-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-6 hidden z-50">
        <div class="bg-white rounded-2xl p-8 shadow-2xl text-center max-w-sm w-full">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Correct!</h2>
            <p class="text-gray-600 mb-6">Well done on identifying the right response.</p>
            <button id="next-btn" class="w-full bg-brand-dark text-white py-4 rounded-lg font-bold">
                Next Question
            </button>
        </div>
    </div>

    <div id="completion-screen" class="bg-white shadow-2xl rounded-xl p-8 max-w-2xl w-full text-center hidden">
        <div class="w-20 h-20 bg-brand-light/30 text-brand-dark rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-brand-darker mb-4">Quiz Complete!</h1>
        <p class="text-gray-700">You have successfully completed the Module 1 Knowledge Check.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const quizData = [
                {
                    question: "Which of the following statements describe why assumptions can be harmful in DFV situations? (Select all that apply)",
                    type: "checkbox",
                    options: [
                        { text: "They can lead to victim-blaming.", id: "q1_a" },
                        { text: "They help us make quick decisions in emergencies.", id: "q1_b" },
                        { text: "They may cause us to minimise abuse.", id: "q1_c" },
                        { text: "They ensure we remain unbiased.", id: "q1_d" }
                    ],
                    correct: ["q1_a", "q1_c"]
                },
                {
                    question: "Why is it important to be aware of your personal values when responding to DFV? (Select all that apply)",
                    type: "checkbox",
                    options: [
                        { text: "Because values never change and must be enforced.", id: "q2_a" },
                        { text: "Because values act like filters and influence how we interpret and respond to situations.", id: "q2_b" },
                        { text: "Because being aware of values helps us avoid harmful judgments.", id: "q2_c" },
                        { text: "Because values determine whether DFV is acceptable.", id: "q2_d" }
                    ],
                    correct: ["q2_b", "q2_c"]
                },
                {
                    question: "Which of the following are essential principles for responding to DFV? (Select all that apply)",
                    type: "checkbox",
                    options: [
                        { text: "Safety First", id: "q3_a" },
                        { text: "Be Non-Judgmental", id: "q3_b" },
                        { text: "Share details with colleagues for transparency", id: "q3_c" },
                        { text: "Respect Their Choices", id: "q3_d" },
                        { text: "Believe and Validate", id: "q3_e" }
                    ],
                    correct: ["q3_a", "q3_b", "q3_d", "q3_e"]
                },
                {
                    question: "Which of these is an example of an assumption that could lead to harm? (Select all that apply)",
                    type: "checkbox",
                    options: [
                        { text: "“If it was really bad, they’d leave.”", id: "q4_a" },
                        { text: "“DFV only happens in certain communities.”", id: "q4_b" },
                        { text: "“It’s our responsibility to ensure safety.”", id: "q4_c" },
                        { text: "“People experiencing DFV always ask for help.”", id: "q4_d" }
                    ],
                    correct: ["q4_a", "q4_b", "q4_d"]
                }
            ];

            const quizContainer = document.getElementById('quiz-container');
            const questionCounter = document.getElementById('question-counter');
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const checkBtn = document.getElementById('check-btn');
            const nextBtn = document.getElementById('next-btn');
            const feedbackText = document.getElementById('feedback-text');
            const correctModal = document.getElementById('correct-modal');
            const completionScreen = document.getElementById('completion-screen');

            let currentIdx = 0;

            function loadQuestion(index) {
                const data = quizData[index];
                questionCounter.textContent = `Question ${index + 1} of ${quizData.length}`;
                questionText.textContent = data.question;
                optionsContainer.innerHTML = '';
                feedbackText.textContent = '';
                
                data.options.forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'option-wrapper border border-gray-300 rounded-lg active:bg-gray-50';
                    div.innerHTML = `
                        <label class="flex items-center p-4 cursor-pointer w-full">
                            <input type="checkbox" id="${opt.id}" value="${opt.id}" class="w-5 h-5 mr-4 flex-shrink-0">
                            <span class="text-gray-700 text-sm md:text-base font-medium">${opt.text}</span>
                        </label>
                    `;
                    optionsContainer.appendChild(div);
                });
                checkBtn.classList.remove('hidden');
                nextBtn.textContent = (currentIdx === quizData.length - 1) ? "Finish Quiz" : "Next Question";
            }

            checkBtn.onclick = () => {
                const selected = Array.from(optionsContainer.querySelectorAll('input:checked')).map(i => i.value);
                const correct = quizData[currentIdx].correct;
                const isCorrect = selected.length === correct.length && selected.every(v => correct.includes(v));

                if (isCorrect) {
                    correctModal.classList.remove('hidden');
                } else {
                    feedbackText.textContent = "That's not quite right. Please try again.";
                    feedbackText.className = "text-center font-semibold text-red-600";
                }
            };

            nextBtn.onclick = () => {
                correctModal.classList.add('hidden');
                currentIdx++;
                if (currentIdx < quizData.length) loadQuestion(currentIdx);
                else {
                    quizContainer.classList.add('hidden');
                    completionScreen.classList.remove('hidden');
                }
            };

            loadQuestion(currentIdx);
        });
    </script>
</body>
</html>
